<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>tap-tap</title>
    <script type="importmap">
      {
        "imports": {
          "three": "../../../node_modules/three/build/three.module.js"
        }
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* 캐릭터 위에 커서가 올라왔을 때만 JS가 pointer 로 바꾼다 */
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
      }

      #bubble {
        position: absolute;
        /* 캐릭터 크기를 줄이면 말풍선도 같이 줄어야 캐릭터를 덮지 않는다 */
        --bubble-scale: 1;
        transform-origin: bottom center;
        transform: translate(-50%, -100%) scale(calc(var(--bubble-scale) * 0.8));
        padding: 7px 13px;
        border-radius: 14px;
        background: #fffaf0;
        color: #4a3f33;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        box-shadow: 0 4px 14px rgba(74, 63, 51, 0.22);
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, transform 220ms cubic-bezier(0.2, 1.4, 0.5, 1);
      }
      #bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 11px;
        height: 11px;
        margin-left: -5.5px;
        background: #fffaf0;
        transform: rotate(45deg);
        border-radius: 2px;
      }
      #bubble.is-visible {
        opacity: 1;
        transform: translate(-50%, -100%) scale(var(--bubble-scale));
      }

      /* ── 찌른 사람 이름표: 발밑에 가만히 ── */
      #nameplate {
        position: absolute;
        --nscale: 1;
        display: flex;
        gap: 5px;
        transform: translate(-50%, 0) scale(var(--nscale));
        transform-origin: top center;
        pointer-events: none;
      }
      .chip {
        padding: 3px 11px;
        border-radius: 999px;
        background: rgba(255, 250, 240, 0.94);
        color: #4a3f33;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 2px 9px rgba(74, 63, 51, 0.2);
        animation: chip-life 2000ms ease-out both;
      }
      @keyframes chip-life {
        0%   { opacity: 0; transform: translateY(7px) scale(0.9); }
        10%  { opacity: 1; transform: translateY(0) scale(1); }
        82%  { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-3px) scale(0.98); }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="nameplate"></div>
    <div id="bubble"></div>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
