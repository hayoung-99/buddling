# 앱을 빌드해서 GitHub Releases 에 올린다.
#
# 평소에는 아무것도 하지 않아도 된다.
#
#   1. main 에 무언가 머지되면 release-please 가 "다음 릴리스" PR 을 만들어 둔다.
#      커밋 메시지의 feat/fix 를 읽어 버전을 정하고 변경 목록을 적어 둔다.
#      머지될 때마다 그 PR 이 갱신된다.
#   2. 내보낼 때가 되면 **그 PR 을 머지한다.** 그 순간 태그와 릴리스가 만들어지고,
#      이어서 빌드가 돌고, 다 올라가면 공개된다.
#
# 태그를 직접 미는 길(`on: push: tags`)도 열려 있지만 평소에는 쓰지 않는다.
# release-please 를 건너뛰므로 `.release-please-manifest.json` 과 `CHANGELOG.md` 가
# 실제 릴리스와 어긋나고, 그다음 릴리스 PR 이 엉뚱한 버전을 제안하게 된다.
#
# release-please 와 빌드가 **한 워크플로 안에** 있는 이유가 있다. GITHUB_TOKEN 이
# 만든 태그는 다른 워크플로를 깨우지 못한다(무한 반복을 막으려는 GitHub 의 규칙이다).
# 릴리스를 만드는 일과 빌드하는 일을 나눠 두면 빌드가 영영 시작되지 않는다.
#
# Supabase 접속 정보는 저장소에 두지 않는다. Settings → Secrets and variables
# → Actions 에 SUPABASE_URL / SUPABASE_ANON_KEY 를 등록해 두면 여기서 굽는다.
#
# 흐름은 네 단계다.
#   prepare  릴리스 PR 을 만들거나 갱신한다. 그 PR 이 머지된 순간에만 다음으로 간다
#   build    mac(arm64·x64) / win 을 각각 빌드해 **초안(draft) 릴리스**에 올린다
#   publish  두 빌드가 다 끝나면 설치 안내를 앞에 붙이고 초안을 공개로 바꾼다
#   refresh  태그가 실제로 생긴 뒤에 릴리스 PR 을 다시 계산한다 (아래 설명)
#
# 초안을 거치는 이유: 설치 파일이 하나도 없는 릴리스가 최신 버전으로 잡히면
# 랜딩페이지의 받기 버튼도, 앱의 자동 업데이트도 헛걸음한다. 둘 다 /releases/latest
# 를 본다.
#
# 주의: 코드 서명을 하지 않으므로 받는 사람은 macOS Gatekeeper·Windows SmartScreen
# 경고를 한 번 넘겨야 합니다. 넘기는 순서는 README 와 랜딩페이지에 적어 두었습니다
# (배포 절차를 적은 docs/RELEASE.md 는 저장소에 올리지 않는 로컬 문서입니다).

name: release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # ── 릴리스 PR 을 만들고 지킨다 (main 에 밀렸을 때만) ──
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      # 릴리스 PR 이 머지되어 실제로 릴리스가 만들어졌을 때만 'true'
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      # 릴리스 PR 이 머지된 실행이라면 여기서 (초안) 릴리스를 만든다.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # 다음 릴리스 PR 은 **릴리스를 만들지 않은** 실행에서만 계산한다.
      #
      # 방금 초안 릴리스를 만든 참이라면 아직 git 태그가 없다 — 태그는 저 아래
      # publish 가 초안을 공개로 바꿀 때 비로소 생긴다. 그 상태로 계산하면
      # release-please 는 어디까지 릴리스됐는지 기준점을 찾지 못해 역사를 처음부터
      # 다시 훑고, 그렇게 나온 PR 은 늘 엉뚱한 버전을 제안한다. 릴리스 네 번 내내
      # 그랬고 그중 셋은 버전을 되돌리는 제안이었다(#12·#16·#18).
      # 그 경우는 태그가 생긴 뒤에 맨 아래 refresh 잡이 맡는다.
      - if: steps.release.outputs.release_created != 'true'
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  build:
    needs: prepare
    # 릴리스 PR 이 머지됐거나, 태그를 직접 밀었을 때 돈다.
    # prepare 가 통째로 건너뛰어져도(태그를 민 경우) 여기는 돌아야 하므로 always() 가 필요하다.
    if: |
      always() && (
        needs.prepare.outputs.released == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64

    runs-on: ${{ matrix.os }}

    steps:
      # 기본 동작 그대로 둔다. 태그를 밀었으면 그 태그를, 릴리스 PR 이 머지됐으면
      # 버전이 올라간 그 커밋을 받는다. 초안 릴리스에는 아직 태그가 없으므로
      # 태그 이름으로 받으려 하면 안 된다.
      - uses: actions/checkout@v7

      # Node 버전은 `.nvmrc` 한 곳에서만 정한다. 여기에 숫자를 또 적으면 로컬과
      # 어긋나고, 그러면 딸려 오는 npm 버전도 갈라져 `package-lock.json` 이
      # 손대지도 않았는데 다시 쓰인다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Supabase 없이도 도는 검사만 여기서 돌린다
      - run: npm test

      # 굽는 것도 포장하는 것도 앱 워크스페이스 안에서 돈다.
      # (설치는 루트에서 한 번만 한다 — workspaces 가 의존성을 루트로 올려 두기 때문이다)
      - name: 접속 정보 굽기
        working-directory: apps/desktop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/bake-config.js

      - name: 패키징
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target }} --publish always

  publish:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: 설치 안내를 붙이고 릴리스를 공개한다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # 받는 사람이 가장 먼저 알아야 하는 것은 "어느 파일을 받고, 경고를 어떻게
          # 넘기는가"다. 그래서 설치 안내를 위에 두고 변경 목록을 아래에 붙인다.
          sed "s/{version}/${TAG}/g" docs/release-notes.md > "${RUNNER_TEMP}/notes.md"

          changelog=$(gh release view "${TAG}" --json body --jq .body || true)
          if [ -n "${changelog}" ]; then
            printf '\n\n---\n\n' >> "${RUNNER_TEMP}/notes.md"
            printf '%s\n' "${changelog}" >> "${RUNNER_TEMP}/notes.md"
          fi

          gh release edit "${TAG}" \
            --title "Buddling ${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --draft=false \
            --latest

  # ── 태그가 생긴 뒤에 다음 릴리스 PR 을 계산한다 ──
  #
  # prepare 는 릴리스를 만든 실행에서 PR 계산을 건너뛴다(위 설명). publish 가 초안을
  # 공개로 바꾸면서 태그가 실재하게 되므로, 여기서 비로소 제대로 계산된다.
  #
  # 릴리스 직후라 올릴 것이 없으면 release-please 는 "No user facing commits found"
  # 로 아무 PR 도 만들지 않는다 — 그게 맞는 결과다. 빌드가 도는 동안 fix 가 머지됐다면
  # 그것만 담은 PR 이 생긴다.
  #
  # 여기서도 릴리스는 건드리지 않는다. 이미 만들어 공개까지 마친 것을 다시 손댈 이유가
  # 없고, 실수로 초안을 하나 더 만드는 길을 아예 막아 둔다.
  refresh:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
