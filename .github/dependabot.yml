# 의존성 업데이트를 PR 로 받아 본다.
#
# 직접 챙기지 않으면 Electron 은 보안 수정을 남긴 채 몇 달씩 뒤처진다.
# 받는 사람 컴퓨터에서 도는 앱이므로 그게 곧 그 사람의 위험이 된다.
#
# 올라온 PR 은 ci 가 먼저 본다. 테스트와 랜딩 점검을 통과하지 못하는 업데이트는
# 머지하기 전에 걸러진다.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 한꺼번에 열 개씩 열리면 아무도 안 본다
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits 로 맞춘다. release-please 가 이 접두사를 읽는다.
      # chore 로 두는 이유: 의존성이 올라갔다고 사용자에게 보일 변경 목록에
      # 줄이 하나 늘어날 이유는 없다.
      prefix: chore
      include: scope
    groups:
      # 자잘한 업데이트는 묶어서 한 PR 로 본다
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
